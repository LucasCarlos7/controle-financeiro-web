<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3db55f"/>
      <stop offset="100%" stop-color="#006b2a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Fundo total sem arredondamento para maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="256" fill="url(#shine)"/>
  <!-- Conteúdo na safe zone (≥10% de margem cada lado = ~51px) -->
  <path d="M120 360 206 262l62 54L396 182"
    fill="none" stroke="white" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="396" cy="182" r="36" fill="white"/>
