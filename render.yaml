services:
  - type: web
    name: controle-financeiro-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
